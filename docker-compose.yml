version: '3.8'

services:
  # MongoDB service
  mongo:
    image: mongo:latest
    container_name: task-manager-mongo
    restart: always
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - app-network

  # Backend API service
  server:
    build: ./server
    container_name: task-manager-server
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/task-manager
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    networks:
      - app-network

  # Frontend client service
  client:
    build: ./client
    container_name: task-manager-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local